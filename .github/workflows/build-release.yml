name: build-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CUDA_ROOT: /usr/local/cuda-12.8.1
      CUDA_RUNFILE: cuda_12.8.1_570.124.06_linux.run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config wget \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libcurl4-openssl-dev
          pkg-config --modversion libavformat libavcodec libavutil libswscale libcurl

      - name: Install CUDA 12.8.1 toolkit
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/12.8.1/local_installers/${CUDA_RUNFILE}
          sh ${CUDA_RUNFILE} --toolkit --silent --override --path=${CUDA_ROOT}
          ${CUDA_ROOT}/bin/nvcc --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DNINFER_BUILD_APPS=ON \
            -DBUILD_TESTING=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DNINFER_STUB_MEDIA=OFF
        env:
          PATH: ${CUDA_ROOT}/bin:$PATH
          CMAKE_CUDA_COMPILER: ${CUDA_ROOT}/bin/nvcc

      - name: Build
        run: cmake --build build --parallel 4 --target ninfer ninfer-serve
        env:
          PATH: ${CUDA_ROOT}/bin:$PATH
          CMAKE_CUDA_COMPILER: ${CUDA_ROOT}/bin/nvcc

      - name: Tag the commit
        run: |
          git config user.name "lwb6"
          git config user.email "lwb.6@qq.com"
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag }}
          name: NInfer ${{ inputs.tag }} (V100 Duo, media enabled)
          body: |
            Linux x86_64 build for 2x Tesla V100 (sm_70), CUDA 12.8.1,
            `NINFER_STUB_MEDIA=OFF` (FFmpeg decode + libcurl URL acquisition enabled).

            Commit: `${{ github.sha }}`
            Runner: `ubuntu-latest`, Ninja, `--parallel 4`

            | Asset | SHA256 |
            |---|---|
            | `ninfer` | `$(sha256sum build/apps/ninfer | cut -d' ' -f1)` |
            | `ninfer-serve` | `$(sha256sum build/apps/ninfer-serve | cut -d' ' -f1)` |

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            build/apps/ninfer
            build/apps/ninfer-serve